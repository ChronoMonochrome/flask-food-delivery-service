version: '3.8'

services:
  # MySQL Database Service
  db:
    env_file:
      - ./.env
    image: mysql:8.0
    container_name: mysql_db
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - app_network
    environment:
      TZ: Europe/Moscow
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pyour_root_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 80s

  # Flask Application Service (served by Gunicorn)
  bot_mandarin_web:
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: flask_app
    restart: always
    ports:
      - "8011:8011"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - ./migrations:/app/migrations  # Скорректирован путь контейнера под ваш WORKDIR /app
    environment:
      TZ: Europe/Moscow

  # New Scheduler Service for periodic iiko data synchronization
  scheduler:
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: iiko_sync_scheduler
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    environment:
      TZ: Europe/Moscow

  # ====================================================================
  # МИКРОСЕРВИС АНАЛИТИКИ (Добавлен новый сервис под управлением Gunicorn)
  # ====================================================================
  analytics_service:
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: Dockerfile.analytics
    container_name: analytics_container
    restart: always
    ports:
      - "5002:5002"  # Внешний порт для доступа к красивой админ-панели Bootstrap
    networks:
      - app_network  # Подключаем к общей сети для связи с монолитом
    environment:
      TZ: Europe/Moscow
    volumes:
      # Направляем volume на сохранение вашей SQLite базы данных analytics.db
      - analytics_db_data:/app/app

volumes:
  db_data:
  analytics_db_data:  # Добавлен volume для персистентности данных аналитики

networks:
  app_network:
    driver: bridge

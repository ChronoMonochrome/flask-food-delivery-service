version: '3.8'

services:
  # MySQL Database Service
  db:
    env_file:
      - ./.env
    image: mysql:8.0 # Using MySQL 8.0 image
    container_name: mysql_db
    volumes:
      # Persistent volume for database data, so data is not lost on container restart
      - db_data:/var/lib/mysql
    ports:
      # Expose port 3307 for direct access from host (optional, mainly for debugging)
      - "3307:3306"
    networks:
      # Connect to the custom application network
      - app_network
    environment: #
      TZ: Europe/Moscow # UTC+03:00 for most of the year (no DST consideration for fixed offset)
      # Or you could specify the offset directly if the OS supports it, like 'UTC+3'
      # But 'Europe/Moscow' is a common choice for UTC+3.
    healthcheck: # Added healthcheck for the database service
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pyour_root_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 80s # Give MySQL time to start before checking

  # Flask Application Service (served by Gunicorn)
  web:
    env_file:
      - ./.env
    build:
      context: . # Build context is the current directory
      dockerfile: Dockerfile.web # Use the Dockerfile.web to build this service's image
    container_name: flask_app
    restart: always # Always restart the container if it stops
    ports:
      # Expose port 8011 for internal communication with Nginx (optional for external access)
      - "8011:8011"
    depends_on:
      # Ensure the database service is up and healthy before starting the web service
      db:
        condition: service_healthy # Changed condition to wait for healthcheck
    networks:
      # Connect to the custom application network
      - app_network
    volumes:
      - ./migrations:/back/app/migrations # Mount the migrations folder
    environment: #
      TZ: Europe/Moscow

  # New Scheduler Service for periodic iiko data synchronization
  scheduler:
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: iiko_sync_scheduler
    restart: always # Always restart the container if it stops
    depends_on:
      db:
        condition: service_healthy # Ensure DB is ready
    networks:
      - app_network
    environment:
      TZ: Europe/Moscow

  # Telegram Bot Service
  bot:
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: telegram_bot
    restart: always
    environment:
      TELEGRAM_TOKEN: "7666900832:AAHu7U0wTgXssv659Z2-lff8bMy6A-DxNmk" # Your Telegram Bot token
      WEB_APP_URL: "https://mytestapp001.ru/" # Your web app URL
      TZ: Europe/Moscow
    depends_on:
      - web # The bot depends on the web app being available for the WEB_APP_URL
    networks:
      - app_network

  # Nginx Proxy Service
  nginx:
    env_file:
      - ./.env
    build:
      context: . # Build context is the current directory
      dockerfile: Dockerfile.nginx # Use the Dockerfile.nginx to build this service's image
    container_name: nginx_proxy
    restart: always # Always restart the container if it stops
    ports:
      # Map host ports 8080 and 8443 to container ports 80 and 443
      - "8080:80"
      - "8443:443"
    volumes:
      # Mount SSL certificates from your host machine into the Nginx container.
      - ./back/certs:/etc/nginx/certs:ro # :ro makes it read-only inside the container
    depends_on:
      # Ensure the web service is up before starting Nginx
      - web
    networks:
      - app_network
    environment:
      TZ: Europe/Moscow

  # NEW: Mock IIKO API Service
  mock_iiko:
    build:
      context: .
      dockerfile: back/mock_iiko_api/Dockerfile # Point to the Dockerfile for mock service
    container_name: mock_iiko_service
    ports:
      - "8888:5000" # Map host port 8888 to container port 5000
    networks:
      - app_network
    env_file:
      - ./.env # Load .env variables for the mock service too (e.g., IIKO_API_TOKEN)
    environment:
      TZ: Europe/Moscow

volumes:
  # Define named volume for database persistence
  db_data:

networks:
  # Define a custom bridge network for inter-service communication
  app_network:
    driver: bridge

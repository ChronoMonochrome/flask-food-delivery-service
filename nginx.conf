# nginx.conf
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # HTTP server block: Redirects all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name mytestapp.ignorelist.com;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server block: Serves your application
    server {
        listen 443 ssl;
        server_name mytestapp.ignorelist.com;

        # Paths for SSL certificates. These will be mounted as Docker volumes.
        # Make sure you have 'fullchain.pem' and 'privkey.pem' in a './certs' directory
        # relative to your docker-compose.yml file.
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Location block for proxying requests to the Flask application
        location / {
            # 'web' is the name of our Flask service defined in docker-compose.yml
            # Requests are proxied to port 8011, where Gunicorn is listening.
            proxy_pass http://web:8011;
            # Set various headers to pass client information to the Flask app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Hide the Charset header to prevent conflicts
            proxy_hide_header Charset;
        }
    }
}
